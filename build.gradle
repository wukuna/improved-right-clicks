plugins { id 'java' }
repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
def runeLiteVersion = providers.gradleProperty('runeLiteVersion').getOrElse('latest.release')
dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    compileOnly 'net.runelite:client:' + runeLiteVersion
    testImplementation 'net.runelite:client:' + runeLiteVersion
    testImplementation 'net.runelite:jshell:' + runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
group = 'com.improvedmenus'
version = '1.0.0'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(11); options.compilerArgs.add('-Xlint:deprecation') }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.improvedmenus.ImprovedMenusLauncher'
    args '--developer-mode', '--debug'
}

test { systemProperty 'filterFixtures', providers.gradleProperty('filterFixtures').getOrElse('') }
